server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # add_header in a location replaces the server-level list, so every location includes the security headers.
  include /etc/nginx/conf.d/security-headers.inc;
  location /api/ { proxy_pass http://hub:8080; }
  # The app shell must be revalidated on every load: otherwise a browser can keep a heuristically cached index.html
  # after a rebuild and keep loading the previous bundle. Deep links (/workbench/..., /crm/...) fall back to it too.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  # Angular output files carry a content hash in their names, so they can be cached for good.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
